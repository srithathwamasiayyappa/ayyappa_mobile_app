      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFD54F" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FFA000" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="1"/>
